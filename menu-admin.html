<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dawat · Weekly Menu</title>
    <script>if(window.self===window.top){const h=window.location.hostname;let v=null;if(h==="igotdawat.github.io")v="igotdawat.vercel.app";else if(h==="ihavedawat.github.io")v="ihavedawat.vercel.app";if(v){const p=window.location.pathname,s=window.location.search,hh=window.location.hash;window.location.href=`https://${v}${p}${s}${hh}`;}};</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="view-transition" content="same-origin" />
  </head>
  <body class="admin-page">
    <div class="lights">
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
    </div>

    <div class="top-fixed">
      <div class="brand">DAWAT</div>
      <div class="tagline">★ আপনার নিমন্ত্রণ ★</div>
    </div>

    <h1>Weekly Menu</h1>
    <p id="menu-subtitle">Loading<span class="loading-dots"><span></span><span></span><span></span></span></p>

    <div class="admin-view" id="menu-view" hidden>
      <div class="admin-toolbar">
        <div class="admin-who">Signed in as <span id="admin-who-email">—</span></div>
        <div class="toolbar-actions">
          <button type="button" id="signout-btn" class="ghost-btn">Sign out</button>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="applications">Applications</a>
        <a href="users">Users</a>
        <a href="meals">Meals</a>
        <a href="menu-admin" class="is-active">Menu</a>
        <a href="orders-admin">Orders</a>
        <a href="topups-admin">Top-ups</a>
        <a href="settings-admin">Settings</a>
      </nav>

      <p class="help-text" hidden>
        Add the meals available on each weekday. This repeats every week. Customers can order until <strong>10 PM the night before</strong>.
      </p>

      <div id="menu-days" class="menu-days"></div>

      <div class="save-bar" id="save-bar" hidden>
        <button type="button" id="save-all">▶ Save weekly menu</button>
        <span id="menu-msg" class="form-msg" hidden></span>
      </div>
    </div>

    <script type="module">
      import { auth, db } from "./js/firebase.js";
      import {
        onAuthStateChanged, signOut
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        collection, getDocs, getDoc, setDoc, doc, query, orderBy, serverTimestamp, onSnapshot
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
      import { WEEKDAY_ORDER, WEEKDAY_LABELS, formatTk } from "./js/app-utils.js";
      import { mountNotificationBell } from "./js/notifications.js";
      import { show404 } from "./js/app-utils.js";
      import { ADMIN_EMAILS } from "./js/admin-config.js";
      import { escape } from "./js/admin-helpers.js";

      const subtitle = document.getElementById("menu-subtitle");
      const view     = document.getElementById("menu-view");
      const whoEmail = document.getElementById("admin-who-email");
      const signoutBtn = document.getElementById("signout-btn");
      const daysEl   = document.getElementById("menu-days");
      const saveBar  = document.getElementById("save-bar");
      const saveBtn  = document.getElementById("save-all");
      const msgEl    = document.getElementById("menu-msg");
      const helpText = document.querySelector('.help-text');

      signoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "/";
      });

      let meals = [];
      let weekly = {};
      const TRASH_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

      function renderDaySection(section) {
        const key = section.dataset.dayKey;
        const selectedIds = Array.isArray(weekly[key]) ? weekly[key] : [];
        const menu = section.querySelector(".admin-order-select-menu");
        const trigger = section.querySelector("[data-menu-trigger]");
        const selectedMeal = meals.find((meal) => meal.id === section.dataset.selectedMealId);

        trigger.querySelector("[data-select-value]").textContent = selectedMeal
          ? `${selectedMeal.name} · ${formatTk(selectedMeal.price)}`
          : "Select a meal";
        menu.innerHTML = meals.map((meal) => `
          <button type="button" class="admin-order-select-option" role="option"
            aria-selected="${meal.id === section.dataset.selectedMealId}"
            data-menu-meal-id="${escape(meal.id)}" ${selectedIds.includes(meal.id) ? "disabled" : ""}>
            <span class="admin-menu-option-name">${escape(meal.name)}</span>
            <span class="admin-menu-option-price">${formatTk(meal.price)}</span>
          </button>
        `).join("");

        const selectedMeals = selectedIds
          .map((id) => meals.find((meal) => meal.id === id))
          .filter(Boolean);
        const selectedList = section.querySelector("[data-menu-meals]");
        selectedList.innerHTML = selectedMeals.length
          ? selectedMeals.map((meal) => `
              <div class="admin-menu-meal">
                <span class="admin-menu-meal-name">${escape(meal.name)}</span>
                <span class="admin-menu-meal-price">${formatTk(meal.price)}</span>
                <button type="button" class="icon-btn icon-btn-danger admin-menu-remove"
                  data-remove-meal="${escape(meal.id)}" aria-label="Remove ${escape(meal.name)}" title="Remove meal">
                  ${TRASH_ICON}
                </button>
              </div>
            `).join("")
          : '<p class="admin-menu-empty">No meals added for this day.</p>';
      }

      function renderMenuDays() {
        if (!meals.length) {
          helpText.hidden = true;
          saveBar.hidden = true;
          daysEl.innerHTML = '<p class="apps-empty">No meals yet. Add some on the Meals page first.</p>';
          return;
        }

        helpText.hidden = false;
        saveBar.hidden = false;
        daysEl.innerHTML = WEEKDAY_ORDER.map((key) => `
          <section class="menu-day" data-day-key="${key}">
            <header class="menu-day-head">
              <h3>${WEEKDAY_LABELS[key]}</h3>
            </header>
            <div class="admin-menu-controls">
              <div class="admin-order-dropdown admin-menu-dropdown">
                <button type="button" class="admin-order-select-trigger" data-menu-trigger
                  aria-haspopup="listbox" aria-expanded="false" aria-controls="menu-${key}-options">
                  <span class="admin-order-select-value" data-select-value>Select a meal</span>
                  <span class="admin-order-select-caret" aria-hidden="true">▾</span>
                </button>
                <div id="menu-${key}-options" class="admin-order-select-menu" role="listbox"
                  aria-label="${WEEKDAY_LABELS[key]} meals" hidden></div>
              </div>
              <button type="button" class="ghost-btn admin-menu-add" data-add-meal>Add meal</button>
            </div>
            <p class="menu-day-msg" data-day-message role="status" hidden></p>
            <div class="admin-menu-meals" data-menu-meals></div>
          </section>
        `).join("");
        daysEl.querySelectorAll(".menu-day").forEach(renderDaySection);
      }

      async function loadAll() {
        const mealsSnap = await getDocs(query(collection(db, "meals"), orderBy("name")));
        meals = mealsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

        const wkSnap = await getDoc(doc(db, "weeklyMenu", "main"));
        weekly = wkSnap.exists() ? (wkSnap.data() || {}) : {};
        const validMealIds = new Set(meals.map((meal) => meal.id));
        WEEKDAY_ORDER.forEach((key) => {
          weekly[key] = Array.isArray(weekly[key])
            ? weekly[key].filter((id) => validMealIds.has(id))
            : [];
        });
        renderMenuDays();
      }

      function closeMenuDropdowns() {
        daysEl.querySelectorAll("[data-menu-trigger]").forEach((trigger) => {
          trigger.setAttribute("aria-expanded", "false");
          trigger.nextElementSibling.hidden = true;
        });
      }

      daysEl.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-menu-trigger]");
        if (trigger) {
          const menu = trigger.nextElementSibling;
          const isOpen = trigger.getAttribute("aria-expanded") === "true";
          closeMenuDropdowns();
          if (!isOpen) {
            menu.hidden = false;
            trigger.setAttribute("aria-expanded", "true");
          }
          return;
        }

        const option = event.target.closest("[data-menu-meal-id]");
        if (option) {
          const section = option.closest(".menu-day");
          const triggerButton = section.querySelector("[data-menu-trigger]");
          section.dataset.selectedMealId = option.dataset.menuMealId;
          renderDaySection(section);
          closeMenuDropdowns();
          triggerButton.focus();
          return;
        }

        const addButton = event.target.closest("[data-add-meal]");
        if (addButton) {
          const section = addButton.closest(".menu-day");
          const key = section.dataset.dayKey;
          const mealId = section.dataset.selectedMealId;
          const message = section.querySelector("[data-day-message]");
          if (!meals.some((meal) => meal.id === mealId)) {
            message.textContent = "Select a meal first.";
            message.hidden = false;
            return;
          }

          weekly[key] = [...(Array.isArray(weekly[key]) ? weekly[key] : []), mealId];
          section.dataset.selectedMealId = "";
          message.hidden = true;
          renderDaySection(section);
          return;
        }

        const removeButton = event.target.closest("[data-remove-meal]");
        if (removeButton) {
          const section = removeButton.closest(".menu-day");
          const key = section.dataset.dayKey;
          weekly[key] = (Array.isArray(weekly[key]) ? weekly[key] : [])
            .filter((id) => id !== removeButton.dataset.removeMeal);
          renderDaySection(section);
        }
      });

      daysEl.addEventListener("keydown", (event) => {
        const trigger = event.target.closest("[data-menu-trigger]");
        const menu = event.target.closest(".admin-order-select-menu");
        if (event.key === "Escape" && (trigger || menu)) {
          closeMenuDropdowns();
          if (menu) menu.previousElementSibling.focus();
          return;
        }

        if (trigger && ["ArrowDown", "ArrowUp"].includes(event.key)) {
          event.preventDefault();
          const section = trigger.closest(".menu-day");
          const options = section.querySelectorAll('[role="option"]:not(:disabled)');
          if (!options.length) return;
          closeMenuDropdowns();
          trigger.nextElementSibling.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
          options[0].focus();
          return;
        }

        if (menu && ["ArrowDown", "ArrowUp"].includes(event.key)) {
          event.preventDefault();
          const options = [...menu.querySelectorAll('[role="option"]:not(:disabled)')];
          if (!options.length) return;
          const index = options.indexOf(document.activeElement);
          const step = event.key === "ArrowDown" ? 1 : -1;
          options[(index + step + options.length) % options.length].focus();
        }
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".admin-menu-dropdown")) closeMenuDropdowns();
      });

      saveBtn.addEventListener("click", async () => {
        msgEl.hidden = true; msgEl.classList.remove("is-ok", "is-err");
        saveBtn.disabled = true;
        saveBtn.innerHTML = '▶ Saving<span class="loading-dots"><span></span><span></span><span></span></span>';
        try {
          const payload = {};
          WEEKDAY_ORDER.forEach((key) => {
            const sec = daysEl.querySelector(`.menu-day[data-day-key="${key}"]`);
            if (!sec) { payload[key] = []; return; }
            payload[key] = Array.isArray(weekly[key]) ? [...new Set(weekly[key])] : [];
          });
          await setDoc(doc(db, "weeklyMenu", "main"), {
            ...payload,
            updatedAt: serverTimestamp(),
            updatedBy: auth.currentUser ? auth.currentUser.email : null
          }, { merge: true });
          msgEl.textContent = "✓ Saved";
          msgEl.classList.add("is-ok"); msgEl.hidden = false;
        } catch (err) {
          console.error(err);
          msgEl.textContent = "Could not save.";
          msgEl.classList.add("is-err"); msgEl.hidden = false;
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '▶ Save weekly menu';
        }
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.replace("/"); return; }
        if (!ADMIN_EMAILS.includes((user.email || "").toLowerCase())) {
          await show404(); return;
        }
        whoEmail.textContent = user.email;
        subtitle.textContent = "Set the meals offered each weekday.";
        view.hidden = false;
        mountNotificationBell({ user });
        try {
          await loadAll();
        } catch (err) {
          console.error(err);
          daysEl.innerHTML = '<p class="apps-empty is-err">Could not load menu data.</p>';
        }

        // Keep the menu UI in sync with meals in real-time. If meals become empty,
        // hide the help text and save bar immediately.
        onSnapshot(query(collection(db, "meals"), orderBy("name")), async () => {
          try {
            await loadAll();
          } catch (err) {
            console.error("reload error", err);
          }
        }, (err) => { console.error(err); });
      });
    </script>
  </body>
</html>
