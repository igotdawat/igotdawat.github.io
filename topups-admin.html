<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dawat · Top-ups</title>
    <script>if(window.self===window.top){const h=window.location.hostname;let v=null;if(h==="igotdawat.github.io")v="igotdawat.vercel.app";else if(h==="ihavedawat.github.io")v="ihavedawat.vercel.app";if(v){const p=window.location.pathname,s=window.location.search,hh=window.location.hash;window.location.href=`https://${v}${p}${s}${hh}`;}};</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="view-transition" content="same-origin" />
  </head>
  <body class="admin-page">
    <div class="lights">
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
    </div>

    <div class="top-fixed">
      <div class="brand">DAWAT</div>
      <div class="tagline">★ আপনার নিমন্ত্রণ ★</div>
    </div>

    <h1>Top-ups</h1>
    <p id="topups-subtitle">Loading<span class="loading-dots"><span></span><span></span><span></span></span></p>

    <div class="admin-view" id="topups-view" hidden>
      <div class="admin-toolbar">
        <div class="admin-who">Signed in as <span id="admin-who-email">—</span></div>
        <div class="toolbar-actions">
          <button type="button" id="signout-btn" class="ghost-btn">Sign out</button>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="applications">Applications</a>
        <a href="users">Users</a>
        <a href="meals">Meals</a>
        <a href="menu-admin">Menu</a>
        <a href="orders-admin">Orders</a>
        <a href="topups-admin" class="is-active">Top-ups</a>
        <a href="settings-admin">Settings</a>
      </nav>

      <button type="button" class="ghost-btn cash-payment-toggle" id="cash-payment-toggle"
        aria-expanded="false" aria-controls="cash-payment-form">＋ Record cash payment</button>
      <form id="cash-payment-form" class="app-card cash-payment-form" hidden>
        <h2 class="app-card-name">Record cash payment</h2>
        <label for="cash-payment-customer-trigger">Customer</label>
        <div class="admin-order-dropdown">
          <select id="cash-payment-customer" class="admin-order-select-source" hidden>
            <option value="">Select a customer</option>
          </select>
          <button type="button" class="admin-order-select-trigger" id="cash-payment-customer-trigger"
            aria-haspopup="listbox" aria-expanded="false" aria-required="true"
            aria-controls="cash-payment-customer-options">
            <span class="admin-order-select-value" data-select-value>Select a customer</span>
            <span class="admin-order-select-caret" aria-hidden="true">▾</span>
          </button>
          <div id="cash-payment-customer-options" class="admin-order-select-menu" role="listbox"
            aria-label="Approved customers" hidden></div>
        </div>
        <label for="cash-payment-amount">Amount (Tk)</label>
        <input id="cash-payment-amount" type="number" min="100" max="10000" step="1" required />
        <label for="cash-payment-note">Note (optional)</label>
        <input id="cash-payment-note" type="text" maxlength="160" placeholder="Cash received at office" />
        <button type="submit" id="cash-payment-submit">▶ Add cash payment</button>
        <p id="cash-payment-message" class="form-msg" role="status" hidden></p>
      </form>

      <div class="filter-pills" role="tablist">
        <button type="button" class="pill is-active" data-filter="pending"   role="tab" aria-selected="true">Pending</button>
        <button type="button" class="pill"           data-filter="confirmed" role="tab" aria-selected="false">Confirmed</button>
        <button type="button" class="pill"           data-filter="rejected"  role="tab" aria-selected="false">Declined</button>
      </div>

      <div id="topups-list" class="apps-list" aria-live="polite">
        <p class="apps-empty">Loading<span class="loading-dots"><span></span><span></span><span></span></span></p>
      </div>
    </div>

    <script type="module">
      import { auth, db } from "./js/firebase.js";
      import {
        onAuthStateChanged, signOut
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        collection, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
      import { formatTk } from "./js/app-utils.js";
      import { notify, mountNotificationBell } from "./js/notifications.js";
      import { confirmDialog, alertDialog } from "./js/modal.js";
      import { show404 } from "./js/app-utils.js";
      import { ADMIN_EMAILS } from "./js/admin-config.js";
      import { escape } from "./js/admin-helpers.js";

      const subtitle = document.getElementById("topups-subtitle");
      const view     = document.getElementById("topups-view");
      const whoEmail = document.getElementById("admin-who-email");
      const signoutBtn = document.getElementById("signout-btn");
      const listEl   = document.getElementById("topups-list");
      const pills    = document.querySelectorAll(".filter-pills .pill");
      const cashPaymentToggle = document.getElementById("cash-payment-toggle");
      const cashPaymentForm = document.getElementById("cash-payment-form");
      const cashCustomerSelect = document.getElementById("cash-payment-customer");
      const cashCustomerDropdown = createCashCustomerDropdown();
      const cashPaymentSubmit = document.getElementById("cash-payment-submit");
      const cashPaymentMessage = document.getElementById("cash-payment-message");
      const cashPaymentRequestStorageKey = "dawat-cash-payment-request-id";
      const savedCashPaymentRequestId = sessionStorage.getItem(cashPaymentRequestStorageKey) || "";
      let cashPaymentRequestId = /^[A-Za-z0-9_-]{20}$/.test(savedCashPaymentRequestId)
        ? savedCashPaymentRequestId
        : "";

      let adminEmail = "";
      let currentFilter = "pending";
      let allRows = [];
      const namesByEmail = {};
      const TOPUPS_PER_PAGE = 10;
      let topupsPage = 0;
      const filterCounts = { pending: 0, confirmed: 0, rejected: 0 };
      const FILTER_LABELS = {
        pending: "Pending",
        confirmed: "Confirmed",
        rejected: "Declined"
      };

      function createCashCustomerDropdown() {
        const wrapper = cashCustomerSelect.closest(".admin-order-dropdown");
        const trigger = wrapper.querySelector(".admin-order-select-trigger");
        const valueLabel = trigger.querySelector("[data-select-value]");
        const menu = wrapper.querySelector(".admin-order-select-menu");

        function enabledOptions() {
          return Array.from(menu.querySelectorAll('[role="option"]:not(:disabled)'));
        }

        function close(focusTrigger = false) {
          menu.hidden = true;
          trigger.setAttribute("aria-expanded", "false");
          if (focusTrigger) trigger.focus();
        }

        function refresh() {
          const selected = cashCustomerSelect.selectedOptions[0];
          valueLabel.textContent = selected ? selected.textContent : "Select a customer";
          menu.replaceChildren();

          const options = Array.from(cashCustomerSelect.options).filter((option) => option.value !== "");
          if (!options.length) {
            const empty = document.createElement("div");
            empty.className = "admin-order-select-empty";
            empty.textContent = "No approved customers available.";
            menu.appendChild(empty);
            return;
          }

          options.forEach((option) => {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "admin-order-select-option";
            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", String(option.selected));
            item.tabIndex = -1;
            item.textContent = option.textContent;
            item.dataset.value = option.value;
            menu.appendChild(item);
          });
        }

        function focusOption(index) {
          const options = enabledOptions();
          if (!options.length) return;
          const item = options[(index + options.length) % options.length];
          item.focus({ preventScroll: true });

          const menuRect = menu.getBoundingClientRect();
          const itemRect = item.getBoundingClientRect();
          if (itemRect.top < menuRect.top) menu.scrollTop -= menuRect.top - itemRect.top;
          else if (itemRect.bottom > menuRect.bottom) menu.scrollTop += itemRect.bottom - menuRect.bottom;
        }

        function open(direction = 0) {
          refresh();
          menu.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
          const options = enabledOptions();
          const selectedIndex = options.findIndex((item) => item.dataset.value === cashCustomerSelect.value);
          const startIndex = selectedIndex >= 0
            ? selectedIndex + direction
            : (direction < 0 ? options.length - 1 : 0);
          if (options.length) focusOption(startIndex);
        }

        cashCustomerSelect.addEventListener("change", refresh);
        trigger.addEventListener("click", () => {
          if (menu.hidden) open();
          else close();
        });
        trigger.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            open(event.key === "ArrowDown" ? 1 : -1);
          } else if (event.key === "Escape" && !menu.hidden) {
            event.preventDefault();
            close(true);
          }
        });
        menu.addEventListener("click", (event) => {
          const item = event.target.closest('[role="option"]');
          if (!item || item.disabled) return;
          cashCustomerSelect.value = item.dataset.value;
          cashCustomerSelect.dispatchEvent(new Event("change", { bubbles: true }));
          close(true);
        });
        menu.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            const options = enabledOptions();
            focusOption(options.indexOf(document.activeElement) + (event.key === "ArrowDown" ? 1 : -1));
          } else if (event.key === "Home" || event.key === "End") {
            event.preventDefault();
            focusOption(event.key === "Home" ? 0 : enabledOptions().length - 1);
          } else if (event.key === "Escape") {
            event.preventDefault();
            close(true);
          }
        });
        document.addEventListener("click", (event) => {
          if (!wrapper.contains(event.target)) close();
        });

        refresh();
        return { focus: () => trigger.focus(), refresh };
      }

      function syncPills() {
        pills.forEach((x) => {
          const filter = x.dataset.filter;
          const on = filter === currentFilter;
          x.classList.toggle("is-active", on);
          x.setAttribute("aria-selected", on ? "true" : "false");
          x.textContent = FILTER_LABELS[filter] + " (" + (filterCounts[filter] || 0) + ")";
        });
      }

      function setFilter(name) {
        if (name !== "pending" && name !== "confirmed" && name !== "rejected") name = "pending";
        currentFilter = name;
        topupsPage = 0;
        syncPills();
        render();
      }
      function formatWhen(ts) {
        if (!ts || !ts.toMillis) return "—";
        const dt = new Date(ts.toMillis());
        return dt.toLocaleDateString("en-GB", { day:"2-digit", month:"2-digit", year:"numeric" }) +
          ", " + dt.toLocaleTimeString();
      }

      signoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "/";
      });

      pills.forEach((p) => {
        p.addEventListener("click", () => {
          history.replaceState(null, "", "#" + p.dataset.filter);
          setFilter(p.dataset.filter);
        });
      });
      window.addEventListener("hashchange", () => {
        setFilter((location.hash || "#pending").slice(1));
      });

      function render() {
        filterCounts.pending   = 0;
        filterCounts.confirmed = 0;
        filterCounts.rejected  = 0;
        allRows.forEach((r) => {
          const status = (r.status || "pending");
          if (status === "pending" || status === "confirmed" || status === "rejected") {
            filterCounts[status] += 1;
          }
        });
        syncPills();

        const rows = allRows.filter((r) => (r.status || "pending") === currentFilter);
        if (!rows.length) {
          const empty = currentFilter === "rejected" ? "declined" : currentFilter;
          listEl.innerHTML = '<p class="apps-empty">No ' + empty + ' top-ups.</p>';
          return;
        }
        const totalPages = Math.max(1, Math.ceil(rows.length / TOPUPS_PER_PAGE));
        if (topupsPage >= totalPages) topupsPage = totalPages - 1;
        if (topupsPage < 0) topupsPage = 0;
        const start = topupsPage * TOPUPS_PER_PAGE;
        const pageRows = rows.slice(start, start + TOPUPS_PER_PAGE);
        const cardsHTML = pageRows.map((t) => {
          const isPending = t.status === "pending" || !t.status;
          const statusCls = t.status === "confirmed" ? "status-approved"
                          : t.status === "rejected"  ? "status-rejected"
                          : "status-pending";
          const statusLabel = t.status === "confirmed" ? "confirmed"
                            : t.status === "rejected"  ? "declined"
                            : "pending";
          const isCash = t.paymentMethod === "cash";
          const whenRow = isPending
            ? '<dt>Requested</dt><dd>' + escape(formatWhen(t.requestedAt)) + '</dd>'
            : isCash
              ? '<dt>Recorded</dt><dd>' + escape(formatWhen(t.requestedAt)) + '</dd>' +
                '<dt>Added by</dt><dd>' + escape(t.adminEmail || "Admin") + '</dd>'
              : '<dt>Requested</dt><dd>' + escape(formatWhen(t.requestedAt)) + '</dd>' +
                '<dt>' + (t.status === "confirmed" ? "Confirmed" : "Declined") + '</dt>' +
                '<dd>' + escape(formatWhen(t.confirmedAt)) +
                  (t.adminEmail ? ' <span class="muted">by ' + escape(t.adminEmail) + '</span>' : '') +
                '</dd>';
          const paymentRow = '<dt>Method</dt><dd>' + (isCash ? "Cash" : "Bank transfer") + '</dd>';
          const referenceRow = isCash ? '' : '<dt>Bank ref</dt><dd>' + escape(t.bankRef || "—") + '</dd>';
          const noteRow = t.note
            ? '<dt>Note</dt><dd>' + escape(t.note) + '</dd>'
            : '';
          const actions = isPending
            ? '<div class="card-actions">' +
                '<button type="button" class="btn-approve" data-action="confirm" data-id="' + t.id + '">✓ Confirm</button>' +
                '<button type="button" class="btn-reject"  data-action="reject"  data-id="' + t.id + '">✗ Decline</button>' +
              '</div>'
            : '';
          return '<article class="app-card" data-id="' + t.id + '">' +
            '<header class="card-head">' +
              '<div>' +
                '<span class="card-name">' + escape(namesByEmail[(t.userEmail || "").toLowerCase()] || t.userEmail || "—") + '</span>' +
                (t.userEmail ? '<div class="muted" style="font-size:12px; margin-top:2px;">' + escape(t.userEmail) + '</div>' : '') +
              '</div>' +
              '<div class="card-head-right">' +
                '<span class="card-status ' + statusCls + '">' + statusLabel + '</span>' +
              '</div>' +
            '</header>' +
            '<dl class="card-fields">' +
              '<dt>Amount</dt><dd><strong style="color: var(--gold);">' + formatTk(Number(t.amount || 0)) + '</strong></dd>' +
              paymentRow +
              referenceRow +
              noteRow +
              whenRow +
            '</dl>' +
            actions +
          '</article>';
        }).join("");
        const pager = rows.length > TOPUPS_PER_PAGE
          ? `<div class="wallet-pager">
              <button type="button" class="ghost-btn" data-pager="prev"${topupsPage === 0 ? " disabled" : ""}>◀ Prev</button>
              <span>Page ${topupsPage + 1} / ${totalPages}</span>
              <button type="button" class="ghost-btn" data-pager="next"${topupsPage >= totalPages - 1 ? " disabled" : ""}>Next ▶</button>
            </div>`
          : "";
        listEl.innerHTML = cardsHTML + pager;
      }

      cashPaymentToggle.addEventListener("click", () => {
        cashPaymentForm.hidden = !cashPaymentForm.hidden;
        cashPaymentToggle.setAttribute("aria-expanded", String(!cashPaymentForm.hidden));
        if (!cashPaymentForm.hidden) cashCustomerDropdown.focus();
      });

      cashPaymentForm.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        if (!cashCustomerSelect.value) {
          cashPaymentMessage.textContent = "Select a customer.";
          cashPaymentMessage.className = "form-msg is-err";
          cashPaymentMessage.hidden = false;
          cashCustomerDropdown.focus();
          return;
        }
        cashPaymentMessage.hidden = true;
        cashPaymentMessage.className = "form-msg";
        cashPaymentSubmit.disabled = true;
        cashPaymentSubmit.textContent = "Adding cash payment…";

        try {
          const userEmail = cashCustomerSelect.value;
          const amount = Number(document.getElementById("cash-payment-amount").value);
          const confirmed = await confirmDialog({
            title: "Record cash payment",
            message: `Add ${formatTk(amount)} to ${userEmail}'s wallet now? This immediately increases their balance.`,
            confirmLabel: "Add payment"
          });
          if (!confirmed) return;

          const token = await auth.currentUser?.getIdToken();
          if (!token) throw new Error("User not authenticated");
          if (!cashPaymentRequestId) {
            cashPaymentRequestId = doc(collection(db, "topups")).id;
            sessionStorage.setItem(cashPaymentRequestStorageKey, cashPaymentRequestId);
          }

          const response = await fetch(window.location.origin + "/api/topups", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              action: "cash",
              requestId: cashPaymentRequestId,
              userEmail,
              amount,
              note: document.getElementById("cash-payment-note").value.trim()
            })
          });
          const result = await response.json();
          if (!response.ok) {
            if (response.status === 409) {
              cashPaymentRequestId = "";
              sessionStorage.removeItem(cashPaymentRequestStorageKey);
            }
            throw new Error(result.error || "Could not record cash payment");
          }

          cashPaymentForm.reset();
          cashCustomerDropdown.refresh();
          cashPaymentRequestId = "";
          sessionStorage.removeItem(cashPaymentRequestStorageKey);
          cashPaymentMessage.textContent =
            result.alreadyHandled
              ? `This request was already recorded: ${formatTk(result.amount)} for ${result.userEmail}.`
              : `Cash payment of ${formatTk(amount)} added for ${userEmail}. New balance: ${formatTk(result.balance)}.`;
          cashPaymentMessage.classList.add("is-ok");
          cashPaymentMessage.hidden = false;
        } catch (error) {
          console.error("Cash payment failed:", error);
          cashPaymentMessage.textContent = "Could not add cash payment. Try again.";
          cashPaymentMessage.classList.add("is-err");
          cashPaymentMessage.hidden = false;
        } finally {
          cashPaymentSubmit.disabled = false;
          cashPaymentSubmit.textContent = "▶ Add cash payment";
        }
      });

      listEl.addEventListener("click", async (ev) => {
        const pagerBtn = ev.target.closest("[data-pager]");
        if (pagerBtn) {
          if (pagerBtn.dataset.pager === "prev") topupsPage = Math.max(0, topupsPage - 1);
          else topupsPage += 1;
          render();
          return;
        }
        const btn = ev.target.closest("button[data-action]");
        if (!btn) return;
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const t = allRows.find((r) => r.id === id);
        if (!t) return;

        const card = btn.closest(".app-card");
        const buttons = card ? card.querySelectorAll("button") : [];
        buttons.forEach((b) => (b.disabled = true));
        btn.innerHTML = action === "confirm" 
          ? '✓ Confirming<span class="loading-dots"><span></span><span></span><span></span></span>'
          : '✗ Declining<span class="loading-dots"><span></span><span></span><span></span></span>';
        try {
          if (action === "confirm") {
            const ok = await confirmDialog({
              title: "Confirm top-up",
              message: "Confirm top-up of " + formatTk(Number(t.amount || 0)) + " for " + (t.userEmail || "") + "?",
              confirmLabel: "Confirm"
            });
            if (!ok) {
              buttons.forEach((b) => (b.disabled = false));
              btn.innerHTML = action === "confirm" ? '✓ Confirm' : '✗ Decline';
              return;
            }
            const token = await auth.currentUser?.getIdToken();
            if (!token) {
              throw new Error('User not authenticated');
            }
            const response = await fetch(window.location.origin + "/api/topups", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({ action: 'confirm', topupId: t.id })
            });
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.error || 'Failed to confirm topup');
            }
            const res = await response.json();
            if (res.alreadyHandled) {
              await alertDialog({
                title: "Already " + res.status,
                message: "This top-up was already " + res.status + ". No change was made."
              });
              return;
            }
            await notify({
              userId: t.userId,
              userEmail: t.userEmail,
              message:
                "Top-up confirmed\n" +
                "Amount: " + formatTk(Number(t.amount || 0)) + "\n" +
                "Bank ref: " + (t.bankRef || "—"),
              link: "wallet#history",
              linkText: "View wallet",
              type: "topup-confirmed"
            });
          } else if (action === "reject") {
            const ok = await confirmDialog({
              title: "Decline top-up",
              message: "Decline this top-up request?",
              confirmLabel: "Decline",
              danger: true
            });
            if (!ok) {
              buttons.forEach((b) => (b.disabled = false));
              btn.innerHTML = action === "confirm" ? '✓ Confirm' : '✗ Decline';
              return;
            }
            const token = await auth.currentUser?.getIdToken();
            if (!token) {
              throw new Error('User not authenticated');
            }
            const response = await fetch(window.location.origin + "/api/topups", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({ action: 'reject', topupId: t.id })
            });
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.error || 'Failed to reject topup');
            }
            const res = await response.json();
            if (res.alreadyHandled) {
              await alertDialog({
                title: "Already " + res.status,
                message: "This top-up was already " + res.status + ". No change was made."
              });
              return;
            }
            await notify({
              userId: t.userId,
              userEmail: t.userEmail,
              message:
                "Top-up declined\n" +
                "Amount: " + formatTk(Number(t.amount || 0)) + "\n" +
                "Bank ref: " + (t.bankRef || "—"),
              link: "wallet#history",
              linkText: "View wallet",
              type: "topup-declined"
            });
          }
        } catch (err) {
          console.error(err);
          alertDialog({ title: "Error", message: "Could not update. Try again." });
          buttons.forEach((b) => (b.disabled = false));
          btn.innerHTML = action === "confirm" ? '✓ Confirm' : '✗ Decline';
        }
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "/"; return; }
        if (!ADMIN_EMAILS.includes((user.email || "").toLowerCase())) {
          await show404(); return;
        }
        adminEmail = (user.email || "").toLowerCase();
        whoEmail.textContent = user.email;
        subtitle.textContent = "Review and confirm wallet top-up requests.";
        view.hidden = false;
        mountNotificationBell({ user });
        setFilter((location.hash || "#pending").slice(1));

        onSnapshot(
          collection(db, "applications"),
          (snap) => {
            const approvedCustomers = new Map();
            snap.docs.forEach((d) => {
              const a = d.data();
              const email = (a.email || "").toLowerCase();
              if (email && a.name) namesByEmail[email] = a.name;
              if (email && a.status === "approved") {
                approvedCustomers.set(email, String(a.name || email));
              }
            });
            const selectedEmail = cashCustomerSelect.value;
            cashCustomerSelect.innerHTML = '<option value="">Select a customer</option>' +
              [...approvedCustomers.entries()]
                .sort((a, b) => a[1].localeCompare(b[1]))
                .map(([email, name]) =>
                  `<option value="${escape(email)}">${escape(name)} · ${escape(email)}</option>`
                ).join("");
            if (approvedCustomers.has(selectedEmail)) cashCustomerSelect.value = selectedEmail;
            cashCustomerDropdown.refresh();
            render();
          },
          (err) => console.error("applications subscription:", err)
        );

        onSnapshot(
          query(collection(db, "topups"), orderBy("requestedAt", "desc")),
          (snap) => {
            allRows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            render();
          },
          (err) => {
            console.error(err);
            listEl.innerHTML = '<p class="apps-empty">Failed to load top-ups.</p>';
          }
        );
      });
    </script>
  </body>
</html>
