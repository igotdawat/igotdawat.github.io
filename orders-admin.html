    <meta charset="UTF-8" />

    <title>Dawat · Orders</title>
    <script>if(window.self===window.top){const h=window.location.hostname;let v=null;if(h==="igotdawat.github.io")v="igotdawat.vercel.app";else if(h==="ihavedawat.github.io")v="ihavedawat.vercel.app";if(v){const p=window.location.pathname,s=window.location.search,hh=window.location.hash;window.location.href=`https://${v}${p}${s}${hh}`;}};</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" />

  <body class="admin-page">
    <div class="lights">
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>
      <span class="bulb c1"></span><span class="bulb c2"></span><span class="bulb c3"></span><span class="bulb c4"></span><span class="bulb c5"></span>

    <div class="top-fixed">
      <div class="brand">DAWAT</div>

    <h1>Orders</h1>
    <p id="orders-subtitle">Loading<span class="loading-dots"><span></span><span></span><span></span></span></p>

    <div class="admin-view" id="orders-view" hidden>
      <div class="admin-toolbar">
        <div class="admin-who">Signed in as <span id="admin-who-email">—</span></div>
        <div class="toolbar-actions">
          <button type="button" id="signout-btn" class="ghost-btn">Sign out</button>

      <nav class="admin-nav">
        <a href="applications">Applications</a>

        <a href="orders-admin" class="is-active">Orders</a>

      <form id="admin-order-form" class="app-card admin-order-form">
        <header class="app-card-head">
          <h3 class="app-card-name">Place order for a user</h3>
        </header>
        <label class="form-label" for="admin-order-user-trigger">Customer</label>
        <div class="admin-order-dropdown">
          <select id="admin-order-user" class="admin-order-select-source" hidden>
            <option value="">Loading customers…</option>
          </select>
          <button type="button" id="admin-order-user-trigger" class="admin-order-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-required="true" aria-controls="admin-order-user-options">
            <span class="admin-order-select-value" data-select-value>Loading customers…</span>
            <span class="admin-order-select-caret" aria-hidden="true">▾</span>
          </button>
          <div id="admin-order-user-options" class="admin-order-select-menu" role="listbox" aria-label="Customers" hidden></div>
        </div>
        <span class="admin-order-label">Date</span>
        <div class="admin-date-picker" id="admin-date-picker">
          <input id="admin-order-date" type="hidden" />
          <button type="button" class="ghost-btn admin-date-trigger" id="admin-date-trigger" aria-haspopup="dialog" aria-controls="admin-calendar" aria-expanded="false">
            <span id="admin-date-label"></span><span aria-hidden="true">▾</span>
          </button>
          <div class="admin-calendar" id="admin-calendar" role="dialog" aria-label="Choose delivery date" hidden>

              <button type="button" class="ghost-btn" data-calendar-shift="1" aria-label="Next month">›</button>
            </div>
            <div class="admin-calendar-weekdays" aria-hidden="true">
              <span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
            </div>
            <div class="admin-calendar-days" id="admin-calendar-days"></div>
          </div>
        </div>
        <p class="muted">Admin orders may use any date and current meal item.</p>
        <div class="admin-order-meal-controls">
          <div class="admin-order-field">
            <label for="admin-order-meal-trigger">Meal item</label>
            <div class="admin-order-dropdown">
              <select id="admin-order-meal" class="admin-order-select-source" hidden>
                <option value="">Loading meals…</option>
              </select>
              <button type="button" id="admin-order-meal-trigger" class="admin-order-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="admin-order-meal-options">
                <span class="admin-order-select-value" data-select-value>Loading meals…</span>
                <span class="admin-order-select-caret" aria-hidden="true">▾</span>
              </button>
              <div id="admin-order-meal-options" class="admin-order-select-menu" role="listbox" aria-label="Meal items" hidden></div>
            </div>
          </div>
          <div class="admin-order-field">
            <label for="admin-order-quantity">Quantity</label>
            <div class="qty-stepper has-qty" id="admin-order-quantity-stepper">
              <button type="button" class="qty-btn" data-order-quantity-step="-1" aria-label="Decrease quantity">−</button>
              <input id="admin-order-quantity" type="number" min="1" max="100" step="1" value="1" readonly class="qty-input" aria-label="Quantity to add" />
              <button type="button" class="qty-btn" data-order-quantity-step="1" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <button type="button" class="ghost-btn" id="admin-order-add-meal">Add meal</button>
        </div>
        <div id="admin-order-items" class="menu-picks">
          <p class="apps-empty">Add meal items to this order.</p>
        </div>
        <p class="admin-order-total">Total: <strong id="admin-order-total">৳0</strong></p>
        <div class="menu-day-foot toolbar-actions">
          <button type="submit" id="admin-order-submit">▶ Place order</button>
          <span id="admin-order-message" class="form-msg" role="status" hidden></span>
        </div>

      <div id="orders-list" class="apps-list" aria-live="polite">
        <p class="apps-empty">Loading<span class="loading-dots"><span></span><span></span><span></span></span></p>
      </div>
    </div>

    <script type="module">
      import { auth, db } from "./js/firebase.js";
      import {
        onAuthStateChanged, signOut
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        collection, onSnapshot, query, orderBy, getDocs
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
      import { formatTk, formatDateLabel, toDateKey, getActiveOrderDateKey } from "./js/app-utils.js";
      import { mountNotificationBell } from "./js/notifications.js";
      import { show404 } from "./js/app-utils.js";
      import { ADMIN_EMAILS } from "./js/admin-config.js";
      import { escape } from "./js/admin-helpers.js";

      const subtitle = document.getElementById("orders-subtitle");
      const view     = document.getElementById("orders-view");
      const whoEmail = document.getElementById("admin-who-email");
      const signoutBtn = document.getElementById("signout-btn");
      const listEl   = document.getElementById("orders-list");
      const adminOrderForm = document.getElementById("admin-order-form");
      const adminOrderUser = document.getElementById("admin-order-user");
      const adminOrderDate = document.getElementById("admin-order-date");
      const adminDatePicker = document.getElementById("admin-date-picker");
      const adminDateTrigger = document.getElementById("admin-date-trigger");
      const adminDateLabel = document.getElementById("admin-date-label");
      const adminCalendar = document.getElementById("admin-calendar");
      const adminCalendarMonth = document.getElementById("admin-calendar-month");
      const adminCalendarDays = document.getElementById("admin-calendar-days");
      const adminOrderItems = document.getElementById("admin-order-items");
      const adminOrderMeal = document.getElementById("admin-order-meal");
      const adminOrderQuantity = document.getElementById("admin-order-quantity");
      const adminOrderQuantityStepper = document.getElementById("admin-order-quantity-stepper");
      const adminOrderAddMeal = document.getElementById("admin-order-add-meal");
      const adminOrderTotal = document.getElementById("admin-order-total");
      const adminOrderSubmit = document.getElementById("admin-order-submit");
      const adminOrderMessage = document.getElementById("admin-order-message");
      const adminOrderDropdowns = [];
      const adminOrderUserDropdown = createAdminOrderDropdown(adminOrderUser);
      const adminOrderMealDropdown = createAdminOrderDropdown(adminOrderMeal);

      let customerInfo  = {}; // { email: { name, office, address } }
      let activeEmails  = new Set();
      let blockedEmails = new Set();
      let lastOrders    = [];
      let mealsById     = {};
      let calendarMonth = new Date();
      const DATES_PER_PAGE = 10;
      let datesPage = 0;

      function createAdminOrderDropdown(select) {
        const wrapper = select.closest(".admin-order-dropdown");
        const trigger = wrapper.querySelector(".admin-order-select-trigger");
        const valueLabel = trigger.querySelector("[data-select-value]");
        const menu = wrapper.querySelector(".admin-order-select-menu");
        const dropdown = {
          wrapper,
          focus() {
            trigger.focus();
          },
          close(focusTrigger = false) {
            menu.hidden = true;
            trigger.setAttribute("aria-expanded", "false");
            if (focusTrigger) trigger.focus();
          },
          refresh() {
            const selected = select.selectedOptions[0];
            valueLabel.textContent = selected ? selected.textContent : "";
            trigger.disabled = select.disabled;
            menu.replaceChildren();

            const options = Array.from(select.options).filter((option) => option.value !== "");
            if (!options.length) {
              const empty = document.createElement("div");
              empty.className = "admin-order-select-empty";
              empty.textContent = "No options available.";
              menu.appendChild(empty);
              return;
            }

            options.forEach((option) => {
              const item = document.createElement("button");
              item.type = "button";
              item.className = "admin-order-select-option";
              item.setAttribute("role", "option");
              item.setAttribute("aria-selected", String(option.selected));
              item.textContent = option.textContent;
              item.dataset.value = option.value;
              item.disabled = option.disabled;
              menu.appendChild(item);
            });
          }
        };

        function enabledOptions() {
          return Array.from(menu.querySelectorAll('[role="option"]:not(:disabled)'));
        }

        function focusOption(index) {
          const options = enabledOptions();
          if (!options.length) return;
          const item = options[(index + options.length) % options.length];
          item.focus();
          item.scrollIntoView({ block: "nearest" });
        }

        function open(direction = 0) {
          adminOrderDropdowns.forEach((other) => {
            if (other !== dropdown) other.close();
          });
          dropdown.refresh();
          menu.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
          const options = enabledOptions();
          const selectedIndex = options.findIndex((item) => item.dataset.value === select.value);
          const startIndex = selectedIndex >= 0
            ? selectedIndex + direction
            : (direction < 0 ? options.length - 1 : 0);
          if (options.length) focusOption(startIndex);
        }

        select.addEventListener("change", dropdown.refresh);
        trigger.addEventListener("click", () => {
          if (menu.hidden) open();
          else dropdown.close();
        });
        trigger.addEventListener("keydown", (ev) => {
          if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
            ev.preventDefault();
            open(ev.key === "ArrowDown" ? 1 : -1);
          } else if (ev.key === "Escape" && !menu.hidden) {
            ev.preventDefault();
            dropdown.close(true);
          }
        });
        menu.addEventListener("click", (ev) => {
          const item = ev.target.closest('[role="option"]');
          if (!item || item.disabled) return;
          select.value = item.dataset.value;
          select.dispatchEvent(new Event("change", { bubbles: true }));
          dropdown.close(true);
        });
        menu.addEventListener("keydown", (ev) => {
          if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
            ev.preventDefault();
            const options = enabledOptions();
            focusOption(options.indexOf(document.activeElement) + (ev.key === "ArrowDown" ? 1 : -1));
          } else if (ev.key === "Home" || ev.key === "End") {
            ev.preventDefault();
            focusOption(ev.key === "Home" ? 0 : enabledOptions().length - 1);
          } else if (ev.key === "Escape") {
            ev.preventDefault();
            dropdown.close(true);
          }
        });
        adminOrderDropdowns.push(dropdown);
        dropdown.refresh();
        return dropdown;
      }

      document.addEventListener("click", (ev) => {
        if (!adminOrderDropdowns.some((dropdown) => dropdown.wrapper.contains(ev.target))) {
          adminOrderDropdowns.forEach((dropdown) => dropdown.close());
        }
      });

      function normalizeOfficeName(office) {
        return String(office || "").toLowerCase().replace(/\s+/g, "");
      }
      function dateFromKey(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function formatBracketDate(key) {
        const d = dateFromKey(key);
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
      }
      function custLabel(email) {
        const info = customerInfo[(email || "").toLowerCase()];
        const name = info ? info.name : "";
        return name ? `${escape(name)} <span class="muted">· ${escape(email)}</span>` : escape(email);
      }

      function renderCustomerOptions() {
        const selectedEmail = adminOrderUser.value;
        const options = Array.from(activeEmails).sort().map((email) => {
          const name = customerInfo[email] && customerInfo[email].name;
          const label = name ? `${name} · ${email}` : email;
          return `<option value="${escape(email)}">${escape(label)}</option>`;
        });
        adminOrderUser.innerHTML = '<option value="">Select a customer</option>' + options.join("");
        if (activeEmails.has(selectedEmail)) adminOrderUser.value = selectedEmail;
        adminOrderUserDropdown.refresh();
      }

      function updateAdminOrderTotal() {
        let total = 0;
        adminOrderItems.querySelectorAll(".menu-pick").forEach((pick) => {
          const qty = Number(pick.querySelector(".qty-input").value || 0);
          total += Number(pick.dataset.price || 0) * qty;
        });
        adminOrderTotal.textContent = formatTk(total);
        return total;
      }

      function renderAdminMealOptions() {
        const meals = Object.values(mealsById)
          .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
        adminOrderMeal.innerHTML = '<option value="">Select a meal</option>' + meals.map((meal) =>
          `<option value="${escape(meal.id)}">${escape(meal.name)} · ${formatTk(meal.price)}</option>`
        ).join("");
        adminOrderMeal.disabled = meals.length === 0;
        adminOrderAddMeal.disabled = meals.length === 0;
        adminOrderMealDropdown.refresh();
      }

      function updateAdminMealOptions() {
        const selectedIds = new Set(
          Array.from(adminOrderItems.querySelectorAll(".menu-pick"), (pick) => pick.dataset.mealId)
        );
        Array.from(adminOrderMeal.options).forEach((option) => {
          option.disabled = option.value !== "" && selectedIds.has(option.value);
        });
        if (selectedIds.has(adminOrderMeal.value)) adminOrderMeal.value = "";
        adminOrderMealDropdown.refresh();
      }

      function addAdminOrderMeal() {
        const meal = mealsById[adminOrderMeal.value];
        const qty = Number(adminOrderQuantity.value);
        if (!meal) {
          adminOrderMessage.textContent = "Select a meal first.";
          adminOrderMessage.classList.add("is-err");
          adminOrderMessage.hidden = false;
          return;
        }
        if (!Number.isInteger(qty) || qty < 1 || qty > 100) {
          adminOrderMessage.textContent = "Quantity must be between 1 and 100.";
          adminOrderMessage.classList.add("is-err");
          adminOrderMessage.hidden = false;
          return;
        }
        if (Array.from(adminOrderItems.querySelectorAll(".menu-pick")).some((pick) => pick.dataset.mealId === meal.id)) return;

        const emptyMessage = adminOrderItems.querySelector(".apps-empty");
        if (emptyMessage) emptyMessage.remove();
        const row = document.createElement("div");
        row.className = "menu-pick admin-order-item";
        row.dataset.mealId = meal.id;
        row.dataset.price = String(Number(meal.price || 0));
        row.innerHTML = `
          <span class="menu-pick-name">${escape(meal.name)}</span>
          <span class="menu-pick-price">${formatTk(meal.price)}</span>
          <div class="qty-stepper has-qty">
            <button type="button" class="qty-btn" data-step="-1" aria-label="Decrease ${escape(meal.name)}">−</button>
            <input type="number" min="1" max="100" step="1" value="${qty}" readonly class="qty-input" aria-label="${escape(meal.name)} quantity" />
            <button type="button" class="qty-btn" data-step="1" aria-label="Increase ${escape(meal.name)}">+</button>
          </div>
          <button type="button" class="icon-btn icon-btn-danger admin-order-remove" data-remove-meal aria-label="Remove ${escape(meal.name)}" title="Remove meal">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        `;
        adminOrderItems.appendChild(row);
        adminOrderMeal.value = "";
        adminOrderQuantity.value = "1";
        adminOrderMessage.hidden = true;
        adminOrderMessage.classList.remove("is-ok", "is-err");
        updateAdminMealOptions();
        updateAdminOrderTotal();
      }

      function renderAdminCalendar() {
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const firstWeekday = (new Date(year, month, 1).getDay() + 1) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cellCount = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
        const todayKey = toDateKey(new Date());
        adminCalendarMonth.textContent = calendarMonth.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        adminCalendarDays.innerHTML = Array.from({ length: cellCount }, (_, index) => {
          const day = index - firstWeekday + 1;
          if (day < 1 || day > daysInMonth) return '<span class="admin-calendar-empty" aria-hidden="true"></span>';
          const date = new Date(year, month, day);
          const key = toDateKey(date);
          const classes = ["admin-calendar-day"];
          if (key === adminOrderDate.value) classes.push("is-selected");
          if (key === todayKey) classes.push("is-today");
          return `<button type="button" class="${classes.join(" ")}" data-calendar-date="${key}" aria-pressed="${key === adminOrderDate.value}" aria-label="${formatDateLabel(date)}">${day}</button>`;
        }).join("");
      }

      function setAdminOrderDate(date) {
        adminOrderDate.value = toDateKey(date);
        adminDateLabel.textContent = formatDateLabel(date);
        calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        adminCalendar.hidden = true;
        adminDateTrigger.setAttribute("aria-expanded", "false");
        renderAdminCalendar();
      }

      signoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "/";
      });

      setAdminOrderDate(new Date());
      adminDateTrigger.addEventListener("click", () => {
        const isOpening = adminCalendar.hidden;
        adminCalendar.hidden = !isOpening;
        adminDateTrigger.setAttribute("aria-expanded", String(isOpening));
        if (isOpening) renderAdminCalendar();
      });
      adminCalendar.addEventListener("click", (ev) => {
        const shiftButton = ev.target.closest("[data-calendar-shift]");
        if (shiftButton) {
          calendarMonth.setMonth(calendarMonth.getMonth() + Number(shiftButton.dataset.calendarShift));
          renderAdminCalendar();
          return;
        }
        const dateButton = ev.target.closest("[data-calendar-date]");
        if (dateButton) setAdminOrderDate(dateFromKey(dateButton.dataset.calendarDate));
      });
      document.addEventListener("click", (ev) => {
        if (!adminDatePicker.contains(ev.target)) {
          adminCalendar.hidden = true;
          adminDateTrigger.setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && !adminCalendar.hidden) {
          adminCalendar.hidden = true;
          adminDateTrigger.setAttribute("aria-expanded", "false");
          adminDateTrigger.focus();
        }
      });
      adminOrderAddMeal.addEventListener("click", addAdminOrderMeal);
      adminOrderQuantityStepper.addEventListener("click", (ev) => {
        const stepButton = ev.target.closest("[data-order-quantity-step]");
        if (!stepButton) return;
        const qty = Math.min(100, Math.max(1,
          Number(adminOrderQuantity.value || 1) + Number(stepButton.dataset.orderQuantityStep)
        ));
        adminOrderQuantity.value = String(qty);
      });
      adminOrderItems.addEventListener("click", (ev) => {
        const removeButton = ev.target.closest("[data-remove-meal]");
        if (removeButton) {
          removeButton.closest(".menu-pick").remove();
          if (!adminOrderItems.querySelector(".menu-pick")) {
            adminOrderItems.innerHTML = '<p class="apps-empty">Add meal items to this order.</p>';
          }
          updateAdminMealOptions();
          updateAdminOrderTotal();
          return;
        }
        const stepBtn = ev.target.closest(".qty-btn");
        if (!stepBtn) return;
        const stepper = stepBtn.closest(".qty-stepper");
        const input = stepper.querySelector(".qty-input");
        const next = Math.min(100, Math.max(1, Number(input.value || 1) + Number(stepBtn.dataset.step || 0)));
        input.value = String(next);
        stepper.classList.toggle("has-qty", next > 0);
        updateAdminOrderTotal();
      });

      adminOrderForm.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        adminOrderMessage.hidden = true;
        adminOrderMessage.classList.remove("is-ok", "is-err");

        if (!adminOrderUser.value) {
          adminOrderMessage.textContent = "Select a customer first.";
          adminOrderMessage.classList.add("is-err");
          adminOrderMessage.hidden = false;
          adminOrderUserDropdown.focus();
          return;
        }

        const items = [];
        adminOrderItems.querySelectorAll(".menu-pick").forEach((pick) => {
          const qty = Number(pick.querySelector(".qty-input").value);
          items.push({ mealId: pick.dataset.mealId, qty });
        });
        if (!items.length) {
          adminOrderMessage.textContent = "Select at least one meal.";
          adminOrderMessage.classList.add("is-err");
          adminOrderMessage.hidden = false;
          return;
        }

        const total = updateAdminOrderTotal();
        adminOrderSubmit.disabled = true;
        adminOrderSubmit.textContent = "Placing…";
        try {
          const token = await auth.currentUser.getIdToken();
          const response = await fetch("/api/orders", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              action: "admin-place",
              userEmail: adminOrderUser.value,
              forDate: adminOrderDate.value,
              items,
              clientTotal: total
            })
          });
          const responseText = await response.text();
          let data = {};
          try {
            if (!responseText.trim()) throw new Error("Empty response");
            data = JSON.parse(responseText);
            if (!data || typeof data !== "object" || Array.isArray(data)) {
              throw new Error("Unexpected response format");
            }
          } catch (parseError) {
            console.error("Admin order API returned a non-JSON response:", {
              status: response.status,
              body: responseText.trim().slice(0, 240),
              error: parseError
            });
            throw new Error("Could not place order.");
          }
          if (!response.ok && response.status >= 500) {
            console.error("Admin order API returned a server error:", {
              status: response.status,
              error: data.error || data.message || ""
            });
            throw new Error("Could not place order.");
          }
          if (!response.ok) throw new Error(data.error || `Server error (${response.status})`);

          adminOrderItems.innerHTML = '<p class="apps-empty">Add meal items to this order.</p>';
          updateAdminMealOptions();
          updateAdminOrderTotal();
          adminOrderMessage.textContent = `Order placed. Customer balance: ${formatTk(data.newBalance)}.`;
          adminOrderMessage.classList.add("is-ok");
          adminOrderMessage.hidden = false;
        } catch (error) {
          console.error("Admin order placement failed:", error);
          adminOrderMessage.textContent = error.message || "Could not place order.";
          adminOrderMessage.classList.add("is-err");
          adminOrderMessage.hidden = false;
        } finally {
          adminOrderSubmit.disabled = false;
          adminOrderSubmit.textContent = "▶ Place order";
        }
      });

      function render(orders) {
        lastOrders = orders;
        const live      = orders.filter((o) => o.status !== "cancelled");
        const cancelled = orders.filter((o) => o.status === "cancelled");
        if (!live.length && !cancelled.length) {
          listEl.innerHTML = '<p class="apps-empty">No orders.</p>';
          return;
        }

        // Group by date, then by office (normalized), then by meal
        const byDate = {};
        const officeDisplayNames = {}; // Track first original office name for each normalized key

        for (const o of live) {
          const key = o.forDate;
          if (!byDate[key]) byDate[key] = {};
          const info = customerInfo[(o.userEmail || "").toLowerCase()] || {};
          const office = info.office || "—";
          const normalizedOffice = normalizeOfficeName(office);
          if (!byDate[key][normalizedOffice]) byDate[key][normalizedOffice] = [];
          byDate[key][normalizedOffice].push(o);
          if (!officeDisplayNames[normalizedOffice]) officeDisplayNames[normalizedOffice] = office;
        }

        const cancelledByDate = {};
        for (const o of cancelled) {
          const key = o.forDate;
          if (!cancelledByDate[key]) cancelledByDate[key] = {};
          const info = customerInfo[(o.userEmail || "").toLowerCase()] || {};
          const office = info.office || "—";
          const normalizedOffice = normalizeOfficeName(office);
          if (!cancelledByDate[key][normalizedOffice]) cancelledByDate[key][normalizedOffice] = [];
          cancelledByDate[key][normalizedOffice].push(o);
          if (!officeDisplayNames[normalizedOffice]) officeDisplayNames[normalizedOffice] = office;
        }

        const activeKey = getActiveOrderDateKey();
        const allKeys = Array.from(new Set([...Object.keys(byDate), ...Object.keys(cancelledByDate)])).sort().reverse();
        const totalPages = Math.max(1, Math.ceil(allKeys.length / DATES_PER_PAGE));
        if (datesPage >= totalPages) datesPage = totalPages - 1;
        if (datesPage < 0) datesPage = 0;
        const pageStart = datesPage * DATES_PER_PAGE;
        const pageKeys = allKeys.slice(pageStart, pageStart + DATES_PER_PAGE);

        const cardsHTML = pageKeys.map((key) => {
          const datesByOffice = byDate[key] || {};
          const cancelledDatesByOffice = cancelledByDate[key] || {};
          const allOffices = Array.from(new Set([...Object.keys(datesByOffice), ...Object.keys(cancelledDatesByOffice)])).sort();

          // Calculate totals for this date (across all offices)
          let grandTotal = 0;
          let totalMeals = 0;
          let totalCustomers = 0;
          const customerEmails = new Set();

          for (const normalizedOffice of allOffices) {
            const items = datesByOffice[normalizedOffice] || [];
            for (const o of items) {
              grandTotal += Number(o.total || 0);
              customerEmails.add((o.userEmail || "").toLowerCase());
              for (const it of (o.items || [])) {
                totalMeals += Number(it.qty || 0);
              }
            }
          }
          totalCustomers = customerEmails.size;

          // Build office sections within this date
          const officeCardsHTML = allOffices.map((normalizedOffice) => {
            const displayOffice = officeDisplayNames[normalizedOffice];
            const items = datesByOffice[normalizedOffice] || [];
            const cItems = cancelledDatesByOffice[normalizedOffice] || [];

            // Group by meal
            const byMeal = {};
            let officeGrand = 0;
            for (const o of items) {
              officeGrand += Number(o.total || 0);
              for (const it of (o.items || [])) {
                const k = it.name;
                if (!byMeal[k]) byMeal[k] = { qty: 0, price: it.price, customers: [] };
                byMeal[k].qty += Number(it.qty || 0);
                byMeal[k].customers.push({ email: o.userEmail, qty: Number(it.qty || 0) });
              }
            }

            const byMealCancelled = {};
            for (const o of cItems) {
              for (const it of (o.items || [])) {
                const k = it.name;
                if (!byMealCancelled[k]) byMealCancelled[k] = { qty: 0, customers: [] };
                byMealCancelled[k].qty += Number(it.qty || 0);
                byMealCancelled[k].customers.push({ email: o.userEmail, qty: Number(it.qty || 0) });
              }
            }

            const officeMealQty = Object.values(byMeal).reduce((s, g) => s + g.qty, 0);

            return `
              <div class="office-section" style="margin-bottom: 16px; border-left: 3px solid var(--accent); padding-left: 12px;">
                <h4 class="office-head" style="margin: 0 0 8px 0; font-size: 0.9em; font-weight: 600;">${escape(displayOffice)}</h4>
                <div class="office-summary">
                  ${Object.keys(byMeal).length ? `
                    <ul class="meal-groups">
                      ${Object.entries(byMeal).map(([name, g]) => `
                        <li class="meal-group">
                          <div class="meal-group-head">
                            <strong class="meal-group-name">${escape(name)}</strong>
                            <span class="meal-group-qty">× ${g.qty}</span>
                          </div>
                          <ul class="meal-group-customers">
                            ${g.customers.map((c) => `
                              <li>
                                <span class="cust-email">${custLabel(c.email)}</span>
                                <span class="cust-qty">× ${c.qty}</span>
                              </li>
                            `).join("")}
                          </ul>
                        </li>
                      `).join("")}
                    </ul>
                  ` : '<p class="muted" style="margin:0;">No active orders.</p>'}
                  ${cItems.length ? `
                    <details class="cancelled-details">
                      <summary>
                        <span class="orders-subhead">Cancelled</span>
                        <span class="status-chip is-rejected">${cItems.length}</span>
                      </summary>
                      <ul class="cancelled-list">
                        ${cItems.map((o) => `
                          <li>
                            <span class="cust-email">${custLabel(o.userEmail)}</span>
                            <span class="cust-qty">${(o.items || []).map((it) => `${escape(it.name)} × ${it.qty}`).join(", ")}</span>
                          </li>
                        `).join("")}
                      </ul>
                    </details>
                  ` : ''}
                </div>
              </div>
            `;
          }).join("");

          const stale = key !== activeKey;
          return `
            <article class="app-card ${stale ? "is-stale" : ""}">
              <header class="app-card-head">
                <h3 class="app-card-name">${formatDateLabel(dateFromKey(key))}</h3>
                <div class="card-head-right">
                  <span class="meal-price">${totalCustomers} customer${totalCustomers === 1 ? "" : "s"} · ${totalMeals} meal${totalMeals === 1 ? "" : "s"} · ${formatTk(grandTotal)}</span>
                </div>
              </header>
              <div class="orders-summary">
                ${officeCardsHTML}
              </div>
            </article>
          `;
        }).join("");

        const pager = allKeys.length > DATES_PER_PAGE
          ? `<div class="wallet-pager">
              <button type="button" class="ghost-btn" data-pager="prev"${datesPage === 0 ? " disabled" : ""}>◀ Prev</button>
              <span>Page ${datesPage + 1} / ${totalPages}</span>
              <button type="button" class="ghost-btn" data-pager="next"${datesPage >= totalPages - 1 ? " disabled" : ""}>Next ▶</button>
            </div>`
          : "";
        listEl.innerHTML = cardsHTML + pager;
      }

      listEl.addEventListener("click", (ev) => {
        const pagerBtn = ev.target.closest("[data-pager]");
        if (!pagerBtn) return;
        if (pagerBtn.dataset.pager === "prev") datesPage = Math.max(0, datesPage - 1);
        else datesPage += 1;
        render(lastOrders);
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.replace("/"); return; }
        if (!ADMIN_EMAILS.includes((user.email || "").toLowerCase())) {
          await show404(); return;
        }
        whoEmail.textContent = user.email;
        subtitle.textContent = "Orders, grouped by date and office.";
        view.hidden = false;
        mountNotificationBell({ user });

        try {
          const snap = await getDocs(collection(db, "applications"));
          customerInfo = {};
          activeEmails = new Set();
          blockedEmails = new Set();
          snap.docs.forEach((d) => {
            const a = d.data();
            if (a && a.email) {
              const key = String(a.email).toLowerCase();
              customerInfo[key] = {
                name: a.name || "",
                office: a.office || "—",
                address: a.address || ""
              };
              // Block orders only for explicitly blocking statuses.
              // Missing doc / approved → allowed.
              if (a.status === "banned" || a.status === "rejected" || a.status === "pending") {
                blockedEmails.add(key);
              } else {
                activeEmails.add(key);
              }
            }
          });
        } catch (err) {
          console.error("Could not load applicant names", err);
          adminOrderUser.innerHTML = '<option value="">Could not load customers</option>';
          adminOrderUser.disabled = true;
          adminOrderUserDropdown.refresh();
        }
        if (!adminOrderUser.disabled) renderCustomerOptions();

        try {
          const mealsSnap = await getDocs(collection(db, "meals"));
          mealsById = {};
          mealsSnap.docs.forEach((d) => {
            mealsById[d.id] = { id: d.id, ...d.data() };
          });
          renderAdminMealOptions();
        } catch (err) {
          console.error("Could not load meals for admin orders", err);
          adminOrderMeal.innerHTML = '<option value="">Could not load meals</option>';
          adminOrderMeal.disabled = true;
          adminOrderAddMeal.disabled = true;
          adminOrderMealDropdown.refresh();
        }

        onSnapshot(
          query(collection(db, "orders"), orderBy("forDate")),
          (snap) => {
            const items = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .filter((o) => {
                const key = (o.userEmail || "").toLowerCase();
                // Hide if explicitly blocked OR if the application
                // record no longer exists (user was deleted / disabled).
                return !blockedEmails.has(key) && (key in customerInfo);
              });
            render(items);
          },
          (err) => {
            console.error(err);
            listEl.innerHTML = '<p class="apps-empty is-err">Could not load orders.</p>';
          }
        );
      });
    </script>
  </body>
</html>
